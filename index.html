<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>コミックス</title>
    <meta name="description" content="読んだ最終巻と刊行済みの最新巻の差を表示する" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <!-- iOS はマニフェストの icons を見ないので個別に指定する -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="コミックス" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- マニフェストの theme_color は1色しか持てないので、こちらで両対応する -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1917" />
  </head>
